name: test

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter texpile-editor check
      - run: pnpm --filter texpile-editor lint
      - run: pnpm --filter texpile-editor testonce
      - run: pnpm --filter texpile-typst-syntax-wasm test
      - run: pnpm --filter mathlive test
      - run: npx tsc -p electron --noEmit
