# for join.texpile.com, the browser guest. It has to match the released desktop app people host
# sessions from, so release.yml deploys it after a stable tag publishes; run this by hand only to
# redeploy a release, with that tag picked as the ref
name: join

on:
  workflow_dispatch:
  workflow_call:

jobs:
  deploy:
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    environment: CICD
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter texpile-editor build:web

      - name: Deploy to Cloudflare Workers
        working-directory: apps/texpile-editor
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 deploy
