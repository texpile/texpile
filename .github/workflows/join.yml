# Deploy the browser guest (join.texpile.com) to Cloudflare Workers on changes to master.
# Same CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID secrets as the landing workflow. Workers
# rather than Pages: Cloudflare puts new projects there, and the rest of this repo already is.
name: join

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'apps/texpile-editor/**'
      - '.github/workflows/join.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    # the Cloudflare secrets live in this environment; without naming it they never reach the job
    environment: CICD
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # also copies web/_headers into dist-web, where static-asset serving expects it
      - run: pnpm --filter texpile-editor build:web

      - name: Deploy to Cloudflare Workers
        working-directory: apps/texpile-editor
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 deploy
