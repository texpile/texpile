name: versions

# Writes versions.json again from the releases the download host still serves, without a release.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  versions:
    runs-on: ubuntu-latest
    environment: CICD
    env:
      BUCKET: texpile-releases
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Write versions.json
        run: |
          mkdir -p dist
          npx wrangler@4 r2 object get "$BUCKET/versions.json" --file dist/versions.was.json --remote 2>/dev/null \
            || echo '{"versions":[]}' > dist/versions.was.json
          node apps/texpile-editor/scripts/versions-json.mjs dist/versions.was.json > dist/versions.json
          cat dist/versions.json
          npx wrangler@4 r2 object put "$BUCKET/versions.json" --file dist/versions.json --remote --content-type application/json
