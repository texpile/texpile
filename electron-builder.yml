appId: com.texpile.desktop
productName: Texpile
copyright: Copyright © Texpile

# File associations are declared PER PLATFORM because declaring means different things.
# Windows (nsis) writes the extension's default handler, so it only gets the two formats
# installing Texpile is consent for. macOS and Linux only add us to "Open with" and set no
# default, so they can list everything the editor can actually open. main.ts turns any opened
# file into an "open its folder" workspace action, and fileFromArgv must accept every
# extension listed here or the Linux/Windows argv path drops it silently.

# generic provider = electron-updater feed only: it makes electron-builder emit latest*.yml and
# stamp resources/app-update.yml, and it cannot self-upload (release.yml pushes everything to R2).
# The feed host serves the ymls from the releases bucket and counts checks; the ymls' file urls
# are rewritten to dl.texpile.com by scripts/update-yml.mjs before upload.
publish:
  provider: generic
  url: https://updates.texpile.com

directories:
  output: release

# only the Electron shell goes into the asar; the renderer bundle ships as an extra resource,
# served from the app:// protocol. The exclusions keep third-party sourcemaps/tests out.
# node-pty runtime needs only its .node/.dll/.exe binaries (+ lib/ + bin/); the compiler
# intermediates, sources and debug symbols below are ~20MB of dead weight per install.
files:
  - electron/dist/**/*
  - electron/icon.png
  - package.json
  - '!**/*.map'
  - '!**/node_modules/**/{test,tests,__mocks__}/**'
  - '!**/node_modules/node-pty/build/**/*.{iobj,ipdb,pdb,exp,lib,tlog}'
  - '!**/node_modules/node-pty/build/{deps,obj}/**'
  - '!**/node_modules/node-pty/build/Release/obj/**'
  - '!**/node_modules/node-pty/build/Release/obj.target/**'
  - '!**/node_modules/node-pty/build/*.{sln,gypi,mk}'
  - '!**/node_modules/node-pty/build/Makefile'
  - '!**/node_modules/node-pty/build/*.vcxproj*'
  - '!**/node_modules/node-pty/{third_party,src,deps,scripts,typings}/**'
  - '!**/node_modules/node-pty/prebuilds/**/*.pdb'

# node-pty (its .node binary plus the Windows ConPTY runtime, conpty.dll / OpenConsole.exe) must
# stay out of the asar so it can be dlopen'd at runtime
asarUnpack:
  - '**/node_modules/node-pty/**'

# restore the exec bit on node-pty's macOS spawn-helper (lost in packaging -> "posix_spawnp failed")
afterPack: scripts/after-pack.cjs

extraResources:
  - from: apps/texpile-editor/dist
    to: app-dist
    filter:
      - '**/*'
  # Draft-mode engine (walker.lua / page-extract.lua). Ships OUTSIDE the asar so the
  # user's spawned lualatex can read them by absolute path (reads aren't sandboxed;
  # only writes are). Resolved at runtime via process.resourcesPath/lua.
  - from: electron/lua
    to: lua
    filter:
      - '**/*.lua'

# node-pty is rebuilt for Electron's ABI in the `dist` script (pnpm electron:rebuild), so
# electron-builder must not try (and overwrite) it here
npmRebuild: false

# mac/win take the single 1024 PNG (electron-builder derives .ico/.icns). Linux needs the
# pre-sized set in build/icons: Ubuntu's hicolor theme indexes nothing above 512, so a lone
# 1024 icon is invisible to the launcher (generic gear in the app grid).
protocols:
  - name: Texpile
    schemes: [texpile]

linux:
  target:
    - AppImage
    - deb
  # the desktop entry only advertises these; xdg-mime sets defaults separately, so listing more
  # costs nobody anything
  fileAssociations:
    - ext: [tex, sty, cls, tikz]
      name: LaTeX Document
      mimeType: text/x-tex
    - ext: typ
      name: Typst Document
      mimeType: text/x-typst
    - ext: bib
      name: BibTeX Bibliography
      mimeType: text/x-bibtex
  category: Office
  synopsis: A local, offline editor for LaTeX, Typst, and Markdown
  icon: build/icons

# built names are the download names here too (latest-linux.yml records them, see mac note)
appImage:
  artifactName: ${productName}-${version}.${ext}
deb:
  artifactName: texpile-${version}.${ext}
  # stock postinst probes userns as root, leaving chrome-sandbox non-SUID on Ubuntu 24.04+
  # (AppArmor restricts unprivileged userns) -> app aborts at launch. Ours always SUIDs it.
  afterInstall: build/deb-after-install.tpl

mac:
  # one universal (x64 + arm64) dmg so Intel Macs are covered; a host-arch build on the arm64
  # runner ships an arm64-only dmg. node-pty ships both darwin prebuilds in each staging build.
  # The zip exists only for the updater (Squirrel.Mac consumes it; latest-mac.yml needs it).
  target:
    - target: dmg
      arch: universal
    - target: zip
      arch: universal
  # The universal merge refuses any Mach-O that is byte-identical in the x64 and arm64 staging
  # builds unless whitelisted here. node-pty's prebuilds are exactly that: the npm package carries
  # BOTH single-arch darwin prebuilds, so each staging build holds the identical pair (the runtime
  # dlopens only its own arch's dir). Without this the merge dies on prebuilds/darwin-arm64/pty.node.
  x64ArchFiles: '**/node_modules/node-pty/prebuilds/**'
  # CFBundleDocumentTypes with role Editor only puts Texpile in "Open with"; LaunchServices keeps
  # whatever default the user already had, so this can list everything the editor opens.
  fileAssociations:
    - ext: [tex, sty, cls, tikz]
      name: LaTeX Document
      role: Editor
    - ext: typ
      name: Typst Document
      role: Editor
    - ext: bib
      name: BibTeX Bibliography
      role: Editor
  # built names ARE the download names. latest-mac.yml records these exact filenames, so a
  # CI-side rename would break the updater feed; keep them canonical at the source.
  artifactName: ${productName}-${version}.${ext}
  category: public.app-category.productivity
  # a prebuilt icns, NOT icon.png: electron-builder 26 started deriving a 16x16 variant, and the
  # logo is a thin unplated glyph that rasterises to mostly anti-aliased haze at that size (36%
  # solid ink vs 59% at 32px), which is the speckled dmg title-bar icon. This set omits 16x16 so
  # macOS downscales the 32x32 as it did under 25. Regenerate it if icon.png ever changes.
  icon: electron/icon.icns

# NOTE: per-platform `files` blocks must NOT be used for the cross-platform prebuild pruning:
# a file set containing only exclusions is implicitly '**/*' minus them, which once shipped the
# entire repo inside the asar. The pruning lives in scripts/after-pack.cjs instead.
win:
  target:
    - nsis
  icon: electron/icon.png
  # nsis WRITES the default handler for these, so the list stays at the two formats someone
  # installing a LaTeX/Typst editor is asking for. Companion files (.bib, .sty, .cls) belong to
  # other tools and are left alone here; a user can still point them at Texpile by hand.
  fileAssociations:
    - ext: tex
      name: LaTeX Document
      description: LaTeX Document
    - ext: typ
      name: Typst Document
      description: Typst Document

# show the AGPL text as an installer page (macOS/Linux installs have no comparable UI).
# The artifact name must have no spaces: electron-builder's Trusted Signing signer space-joins
# its Invoke-TrustedSigning -Files arg without quoting, so a spaced name gets split and signing fails.
nsis:
  # tells Explorer the associations changed; electron-builder only does that on UNINSTALL
  include: build/installer.nsh
  license: build/license.txt
  artifactName: ${productName}-Setup-${version}.${ext}
